services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: community
      POSTGRES_PASSWORD: community
      POSTGRES_DB: community
    ports:
      - "5432:5432"
    volumes:
      - community_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U community -d community"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  community_pg:
